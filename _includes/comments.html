{%- if site.comments.enabled -%}
<section class="post-comments" aria-label="댓글">
  <h2>댓글</h2>
  {%- if site.giscus.enabled and site.giscus.repo_id != "" and site.giscus.category_id != "" -%}
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="{{ site.giscus.mapping }}"
    data-strict="{{ site.giscus.strict }}"
    data-reactions-enabled="{{ site.giscus.reactions_enabled }}"
    data-emit-metadata="{{ site.giscus.emit_metadata }}"
    data-input-position="{{ site.giscus.input_position }}"
    data-theme="{{ site.giscus.theme }}"
    data-lang="{{ site.giscus.lang }}"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
  {%- elsif site.utterances.enabled -%}
  <script src="https://utteranc.es/client.js"
    repo="{{ site.utterances.repo }}"
    issue-term="{{ site.utterances.issue_term }}"
    theme="{{ site.utterances.theme }}"
    crossorigin="anonymous"
    async>
  </script>
  {%- endif -%}
</section>
{%- endif -%}
