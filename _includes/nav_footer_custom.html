<footer class="site-footer">
  <a href="{{ '/about/' | relative_url }}">소개</a> · <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
</footer>
<script>
(function () {
  var counts = {
  {%- for p in site.pages -%}
    {%- if p.count_cats -%}
      {%- assign names = p.count_cats | split: "|" -%}
      {%- assign n = 0 -%}
      {%- for post in site.posts -%}
        {%- assign hit = false -%}
        {%- for c in post.categories -%}{%- if names contains c -%}{%- assign hit = true -%}{%- endif -%}{%- endfor -%}
        {%- if hit -%}{%- assign n = n | plus: 1 -%}{%- endif -%}
      {%- endfor -%}
      {{ p.url | relative_url | jsonify }}: {{ n }},
    {%- endif -%}
  {%- endfor -%}
  {{ '/archive/' | relative_url | jsonify }}: {{ site.posts.size }}
  };
  document.querySelectorAll('.nav-list-link').forEach(function (a) {
    var path = new URL(a.href, location.href).pathname;
    if (counts.hasOwnProperty(path)) {
      var s = document.createElement('span');
      s.className = 'nav-count';
      s.textContent = ' (' + counts[path] + ')';
      s.style.opacity = '0.6';
      a.appendChild(s);
    }
  });
})();
</script>
