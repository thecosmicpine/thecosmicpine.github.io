# Site settings
title: TheCosmicPine
description: >-
  개인 블로그 - 기술, 개발, 그리고 생각을 기록합니다.
baseurl: ""
url: "https://thecosmicpine.github.io"
permalink: /posts/:year-:month-:day-:title/

# Build settings
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Just-the-docs theme settings
search_enabled: true
heading_anchors: true

# Zabbix 블루는 _sass/custom/custom.scss 오버라이드 (레이아웃 유지)
# Custom CSS
aux_links:
  "GitHub":
    - "https://github.com/thecosmicpine/thecosmicpine.github.io"

# Navigation structure (Korean labels handled in page front matter)
# Pages use nav_order and parent properties for sidebar hierarchy

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - preview/

# Encoding
encoding: utf-8

# Pagination

# 경량 방문 카운터 (사이드바 메뉴 하단)
visitor_counter:
  enabled: true
  script_url: "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"

# 댓글 (Utterances — GitHub Issues)
comments:
  enabled: true

utterances:
  enabled: true
  repo: "thecosmicpine/thecosmicpine.github.io"
  issue_term: "pathname"
  theme: "preferred-color-scheme"

giscus:
  enabled: false
  repo: "thecosmicpine/thecosmicpine.github.io"
  repo_id: "R_kgDOUO6A7Q"
  category: "General"
  category_id: ""
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred-color-scheme"
  lang: "ko"
