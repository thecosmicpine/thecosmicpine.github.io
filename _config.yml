# Site settings
title: Sungwoon Lee
description: >-
  개인 블로그 - 기술, 개발, 그리고 생각을 기록합니다.
baseurl: ""
url: "https://thecosmicpine.github.io"
permalink: /:year/:month/:day/:title/

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Minima theme settings
minima:
  skin: auto

# Navigation menu (Korean labels)
header_pages:
  - index.md
  - about.md
  - archive.md
  - dev.md
  - notes.md

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/

# Encoding
encoding: utf-8

# Pagination
