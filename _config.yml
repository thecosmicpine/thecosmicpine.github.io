# Site settings
title: TheCosmicPine
description: >-
  지금 모두가 얘기하는 AI·기기·생활 속 궁금증을 공식 자료로 확인해 쉽게 풀어 쓰는 블로그.
lang: ko-KR
locale: ko_KR
baseurl: ""
url: "https://thecosmicpine.github.io"
permalink: /posts/:year-:month-:day-:title/

# Build settings
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap

# Just-the-docs theme settings
search_enabled: true
heading_anchors: true

# Zabbix 블루는 _sass/custom/custom.scss 오버라이드 (레이아웃 유지)
# Custom CSS
# 상단 GitHub 링크는 독자에게 쓸모가 없어 뺐다
aux_links: {}

# 글 안의 강조 상자. 사용법은 README 「글 포맷」 참고
callouts_level: quiet
callouts:
  summary:
    title: 한눈에 보기
    color: blue
  tip:
    title: 이렇게 하세요
    color: green
  warning:
    title: 주의
    color: red
  note:
    title: 덧붙임
    color: purple
  interpret:
    title: 해석
    color: grey-dk

# 글 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/img/site-og.png
  - scope:
      path: "sources"
    values:
      sitemap: false
  # 검색엔진 소유 확인 파일은 사이트맵에서 뺀다
  - scope:
      path: "google*.html"
    values:
      sitemap: false
  - scope:
      path: "naver*.html"
    values:
      sitemap: false

# 검색 엔진 소유 확인 코드. 값을 넣으면 <head>에 meta가 들어간다
site_verification:
  google: ""
  naver: ""
  bing: ""

# 애드센스. 자동 광고는 client만 있으면 켜진다.
# 수동 광고 단위는 애드센스에서 만든 슬롯 번호를 넣을 때만 나온다(비어 있으면 출력 안 함)
adsense:
  client: "ca-pub-7287072613296683"
  slots:
    in_article: ""
    after_post: ""

# Navigation structure (Korean labels handled in page front matter)
# Pages use nav_order and parent properties for sidebar hierarchy

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - preview/
  - scripts/

# 게시 시각보다 먼저 머지된 글도 빌드에 넣는다. GitHub Pages는 푸시할 때만 다시 빌드하므로,
# 미래 시각 글을 빼 두면 다음 푸시까지 사이트에 안 나온다.
future: true

# Encoding
encoding: utf-8

# Pagination

# 경량 방문 카운터 (사이드바 메뉴 하단)
visitor_counter:
  enabled: true
  script_url: "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"

# 댓글 (Utterances — GitHub Issues)
comments:
  enabled: true

utterances:
  enabled: true
  repo: "thecosmicpine/thecosmicpine.github.io"
  issue_term: "pathname"
  theme: "preferred-color-scheme"

giscus:
  enabled: false
  repo: "thecosmicpine/thecosmicpine.github.io"
  repo_id: "R_kgDOUO6A7Q"
  category: "General"
  category_id: ""
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred-color-scheme"
  lang: "ko"
